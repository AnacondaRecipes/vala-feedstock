{% set name = "vala" %}
{% set version = "0.56.19" %}
{% set minor_version = '.'.join(version.split('.')[:2]) %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://download.gnome.org/sources/{{ name }}/{{ minor_version }}/{{ name }}-{{ version }}.tar.xz
  sha256: 5ad7cbbfcc0de61b403d6797c9ef60455bfbebd8e162aec33b5b0b097adfb9d5

build:
  skip: true  # [win]
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - pkg-config
    - bison
    - flex
    - make
  host:
    - glib {{ glib }}
    - gobject-introspection

test:
  files:
    - test.vala
  requires:
    - glib
    - pkg-config
  commands:
    - valac --version | grep -F "{{ version }}"
    - pkg-config --modversion libvala-{{ minor_version }}
    - valac --pkg gobject-2.0 -X -Wl,-rpath -X -Wl,${PREFIX}/lib test.vala
    - ./test

about:
  home: https://gitlab.gnome.org/GNOME/vala
  summary: Compiler for the GObject type system
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: COPYING
  description: |
    Vala is a programming language that aims to bring modern programming
    language features to GNOME developers without imposing any additional
    runtime requirements and without using a different ABI compared to
    applications and libraries written in C.
  doc_url: https://gitlab.gnome.org/GNOME/vala
  dev_url: https://gitlab.gnome.org/GNOME/vala

extra:
  # False positives: the linter cannot render the minor_version jinja in the
  # source URL, and gobject-introspection is only queried for its girdir
  # pkg-config var (never linked against).
  skip-lints:
    - reachable_url
    - host_section_needs_exact_pinnings
  recipe-maintainers:
    - xhochy
